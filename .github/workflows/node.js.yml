name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      # webpack 4 用 md4 做模块哈希，Node 17+ 的 OpenSSL 3 默认把它归进 legacy provider，
      # 不开这个开关会直接报 ERR_OSSL_EVP_UNSUPPORTED。构建本身没问题，是工具链年代差。
      NODE_OPTIONS: --openssl-legacy-provider

    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version-file: '.nvmrc'
    # 仓库不跟踪 package-lock.json —— scratch-vm / scratch-blocks / scratch-render
    # 这些依赖直接跟 TurboWarp 的 develop 分支，锁死版本反而拿不到上游修复。
    # 所以这里只能用 npm install，不能用 npm ci。
    # --legacy-peer-deps：webpack 锁 4.x 与 @webpack-cli/serve 的 peer 要求
    #（webpack ^5）冲突，新版 npm 会 ERESOLVE 失败（原因同 deploy-pages.yml）。
    - name: Install dependencies
      run: npm install --no-audit --no-fund --legacy-peer-deps
    # 刻意不走 `npm run build`：那条脚本第一步是 rimraf 整个 build/，
    # 而 build/ 下的 main.js、ext-plugin-runtime.js、package.json、installer.nsh
    # 是手写的桌面端源码、被 git 跟踪 —— 删掉就没了。这里只跑 webpack。
    # 用 npm run build:web（只跑 webpack，不删 build/），原因同 deploy-pages.yml
    - name: Build
      run: npm run build:web
