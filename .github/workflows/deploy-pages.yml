name: Deploy Pages

# 在云端构建并推送到 gh-pages 分支，由 GitHub Pages 自动发布。
# 目的：本地 node_modules 出现版本错乱 / 内存不足时，不阻塞网站更新。
#
# 注意：这里刻意不使用 `npm run build`。那条脚本第一步是 rimraf 整个 build/，
# 而 build/ 下的 main.js、ext-plugin-runtime.js、package.json、installer.nsh
# 是被 git 跟踪的手写桌面端源码 —— 删掉就没了。这里只跑 webpack。

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      # webpack 4 用 md4 做模块哈希，Node 17+ 的 OpenSSL 3 默认归进 legacy provider，
      # 不开这个开关会直接报 ERR_OSSL_EVP_UNSUPPORTED。
      NODE_OPTIONS: --openssl-legacy-provider
      # 注意：NODE_ENV=production **不能**放在 job 级 —— npm 在该模式下会跳过
      # devDependencies，而 webpack 正是 devDependency，结果是云端
      # node_modules 里根本没有 webpack（npm ls 显示 empty），构建必然失败。
      # 所以它只在 Build 步骤里设（见下）。
      # 站点在子路径 dhdbvcg.github.io/ForgeExt/，ROOT 决定 publicPath
      #（运行时拼 JS / 图片资源的基准）。不设则是相对路径，编辑器页 /editor/
      # 会把资源拼成 /editor/js/...，而实际在 /ForgeExt/js/... → 404。
      ROOT: /ForgeExt/

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      # 仓库不跟踪 package-lock.json：scratch-vm / scratch-blocks / scratch-render
      # 这些依赖直接跟 TurboWarp 的 develop 分支，锁死版本反而拿不到上游修复。
      #
      # --legacy-peer-deps 是必需的：webpack 锁在 4.x（scratch-blocks 只兼容这个
      # 大版本），而 @webpack-cli/serve 的 peer 要求是 webpack ^5，新版 npm 遇到
      # 这种冲突会直接 ERESOLVE 失败而不是警告。这里的版本组合是经过验证的，
      # 加该参数即按旧行为安装。
      - name: Install dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps

      # 显式锁定构建工具链版本。仓库不跟踪 package-lock.json，npm 可能解析出
      # 与本地不一致的版本；曾出现过云端装完 node_modules/webpack/bin 缺失
      # 导致构建失败的情况。这里强制对齐本地验证过的组合，并打印版本便于排查。
      - name: Pin build toolchain
        run: |
          npm install --no-save --no-audit --no-fund --legacy-peer-deps webpack@4.47.0 webpack-cli@3.3.12
          npm ls webpack webpack-cli
          ls node_modules/webpack/bin/

      # 用 npm run build:web（只跑 webpack，不 rimraf build/）：
      #   - 不用 `npm run build`：那条第一步 rimraf 整个 build/，而 build/ 下的
      #     main.js、ext-plugin-runtime.js、package.json、installer.nsh 是被
      #     git 跟踪的手写桌面端源码，删掉就没了。
      #   - 不用 `npx webpack`：npx 会去下载 webpack@5（项目锁 4.47.0）并因缺
      #     CLI 交互式提问卡死到超时。
      # NODE_ENV=production 只在这里设（理由见上方 env 注释）：让 webpack 走
      # production 分支，产物带 contenthash，内容变则文件名变、缓存自动失效。
      - name: Build
        run: npm run build:web
        env:
          NODE_ENV: production

      - name: Add .nojekyll
        run: touch build/.nojekyll

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          publish_branch: gh-pages
          commit_message: '[skip ci] Deploy from ${{ github.sha }}'
